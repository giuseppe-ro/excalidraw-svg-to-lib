[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "excalidraw-svg-to-lib"
version = "1.0.0"
description = "Convert SVG icons into Excalidraw library (.excalidrawlib) files"
requires-python = ">=3.11"
dependencies = [
  "svg.path>=6.3",
  "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "flake8>=7.0.0",
  "mypy>=1.0.0",
]

[project.scripts]
excalidraw-svg-to-lib = "excalidraw_svg_to_lib.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"excalidraw_svg_to_lib" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
